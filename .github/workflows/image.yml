# ghcr.io/oxygenframe/oxframe: the oxframe CLI, Rust and ffmpeg, with the
# SDK precompiled (docker/Dockerfile). Built after each release, or by hand
# for a version already on crates.io.
name: image
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "oxframe-cli version on crates.io, e.g. 0.21.0"
        required: true
permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          v="${INPUT:-$TAG}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      # cargo install needs the version in the crates.io index.
      - name: Wait for crates.io
        run: |
          for _ in $(seq 60); do
            curl -sf https://index.crates.io/ox/fr/oxframe-cli | grep -q "\"vers\":\"${{ steps.v.outputs.version }}\"" && exit 0
            sleep 10
          done
          echo "oxframe-cli ${{ steps.v.outputs.version }} is not on crates.io" >&2
          exit 1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: OXFRAME_VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/oxygenframe/oxframe:${{ steps.v.outputs.version }}
            ghcr.io/oxygenframe/oxframe:latest
          labels: |
            org.opencontainers.image.source=https://github.com/oxygenframe/oxframe-cli
            org.opencontainers.image.description=oxframe CLI, Rust and ffmpeg with the SDK precompiled
            org.opencontainers.image.licenses=MIT OR Apache-2.0
