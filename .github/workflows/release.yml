name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write   # cosign keyless signing

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux binaries link against the runner's glibc: built on 24.04 they
          # need glibc 2.39 (std's pidfd_spawnp) and fail on Debian 12 and
          # Ubuntu 22.04. 22.04 keeps them at 2.34 or older.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Intel macOS runners are retired; Apple's toolchain cross-compiles.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml points at ../oxframe-sdk: the SDK release this CLI creates
      # projects on (SDK_VERSION). A CLI-only patch (0.12.1) still builds on
      # the SDK's v0.12.0. checkout cannot write outside the workspace.
      - id: sdk
        shell: bash
        run: |
          echo "ref=v$(sed -n 's/^pub const SDK_VERSION: &str = "\(.*\)";/\1/p' src/init.rs)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with: { repository: oxygenframe/oxframe-sdk, ref: "${{ steps.sdk.outputs.ref }}", path: oxframe-sdk }
      - run: mv oxframe-sdk ../oxframe-sdk
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1", targets: "${{ matrix.target }}" }
      # ui/dist is committed; the unit test checks it matches ui.lock.
      - run: "cargo test --locked --bins ui::"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::notice::macOS signing secrets are not configured; the binary is not notarized"
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security default-keychain -s build.keychain && security unlock-keychain -p ci build.keychain
          bin=target/${{ matrix.target }}/release/oxframe
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$bin"
          ditto -c -k "$bin" oxframe.zip
          xcrun notarytool submit oxframe.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM" --password "$APPLE_PASSWORD" --wait
      - name: Package
        shell: bash
        run: |
          name=oxframe-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name" && cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/oxframe.exe "$name"/ && 7z a "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/oxframe "$name"/ && tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: sigstore/cosign-installer@v3
      - name: Sign with cosign (keyless)
        shell: bash
        # `[ -e ] && …` would make the loop fail on the archive type that
        # does not exist on this OS.
        run: |
          for f in oxframe-*.tar.gz oxframe-*.zip; do
            if [ -e "$f" ]; then cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"; fi
          done
      - uses: actions/upload-artifact@v7
        # Only the release files: archives, checksums, signatures (not the
        # staging directory the archive was made from).
        with:
          name: "${{ matrix.target }}"
          path: |
            oxframe-*.tar.gz*
            oxframe-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml points at ../oxframe-sdk: the SDK release this CLI creates
      # projects on (SDK_VERSION). A CLI-only patch (0.12.1) still builds on
      # the SDK's v0.12.0. checkout cannot write outside the workspace.
      - id: sdk
        shell: bash
        run: |
          echo "ref=v$(sed -n 's/^pub const SDK_VERSION: &str = "\(.*\)";/\1/p' src/init.rs)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with: { repository: oxygenframe/oxframe-sdk, ref: "${{ steps.sdk.outputs.ref }}", path: oxframe-sdk }
      - run: mv oxframe-sdk ../oxframe-sdk
        shell: bash
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true, path: dist }
      - run: cp install.sh install.ps1 dist/
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ github.ref_name }}"
          notes=$(awk -v v="${tag#v}" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --notes-file <(printf '%s\n' "$notes")
          fi
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.1" }
      - name: Already on crates.io?
        id: published
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -sf -A "oxframe-cli release (https://oxframe.dev)" \
            "https://crates.io/api/v1/crates/oxframe-cli/$v" > /dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo publish --locked
        if: steps.published.outputs.yes != 'true'
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
