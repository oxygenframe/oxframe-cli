# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.oxygenframe/oxframe.
# Called by release.yml after `cargo publish`: the registry checks the
# `mcp-name:` line in the README of the version on crates.io, so the crate
# must be there first. Run it by hand (Actions → mcp-registry) to publish
# the current server.json. GitHub OIDC login proves the repo belongs to the
# oxygenframe org; a published version can't be changed or deleted.
name: mcp-registry
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Already in the registry?
        id: listed
        run: |
          v=$(jq -r .version server.json)
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.oxygenframe%2Foxframe/versions/$v" > /dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mcp-publisher
        if: steps.listed.outputs.yes != 'true'
        run: curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - if: steps.listed.outputs.yes != 'true'
        run: ./mcp-publisher login github-oidc
      - if: steps.listed.outputs.yes != 'true'
        run: ./mcp-publisher publish
